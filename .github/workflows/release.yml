name: Release NodeRadar Pro

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic Version to release (e.g. 1.0.1)'
        required: true
        default: '1.0.1'
      draft:
        description: 'Publish as a Draft Release'
        type: boolean
        required: false
        default: false
      prerelease:
        description: 'Mark as Pre-release'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Release Version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $ver = "${{ inputs.version }}".TrimStart('v')
            $tag = "v$ver"
          } else {
            $tag = "${{ github.ref_name }}"
            $ver = $tag.TrimStart('v')
          }
          Write-Host "Resolved Version: $ver (Tag: $tag)"
          "version=$ver" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Inno Setup
        uses: bensheldon/setup-inno-setup@v1

      - name: Run Test Suite Verification
        shell: pwsh
        run: |
          Write-Host "Running 179 unit & integration tests..." -ForegroundColor Cyan
          dotnet test NodeRadarPro.slnx --configuration Release --nologo --verbosity normal

      - name: Publish Portable Single-File Executable
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          Write-Host "Building Portable Single-File EXE (v$ver)..." -ForegroundColor Cyan
          dotnet publish "NodeRadar Pro.csproj" `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:PublishReadyToRun=true `
            -p:PublishTrimmed=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=$ver `
            --output "./publish/portable" `
            --nologo

      - name: Publish Folder for Inno Setup Installer
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          Write-Host "Building Publish Directory for Installer (v$ver)..." -ForegroundColor Cyan
          dotnet publish "NodeRadar Pro.csproj" `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:PublishTrimmed=true `
            -p:Version=$ver `
            --output "bin/Release/net10.0-windows10.0.19041.0/win-x64/publish" `
            --nologo

      - name: Compile Inno Setup Installer
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          Write-Host "Compiling Inno Setup Installer (v$ver)..." -ForegroundColor Cyan
          iscc /DMyAppVersion="$ver" "Inno/installer.iss"

      - name: Stage Release Artifacts & Generate SHA-256 Checksums
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Path "./dist" -Force | Out-Null

          # Copy and standardize installer name
          $installerSrc = Get-ChildItem -Path "./releases" -Filter "*Setup.exe" | Select-Object -First 1
          if ($installerSrc) {
            Copy-Item -Path $installerSrc.FullName -Destination "./dist/NodeRadar_Pro_v${ver}_Setup.exe" -Force
          }

          # Copy and standardize portable single-file exe
          $portableSrc = Join-Path "./publish/portable" "NodeRadar Pro.exe"
          if (Test-Path $portableSrc) {
            Copy-Item -Path $portableSrc -Destination "./dist/NodeRadar_Pro_v${ver}_Portable_win-x64.exe" -Force
          }

          # Generate cryptographic SHA-256 manifest
          Write-Host "Generating SHA-256 checksums..." -ForegroundColor Cyan
          $manifest = @()
          Get-ChildItem -Path "./dist" -Filter "*.exe" | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $manifest += "$hash  $($_.Name)"
            Write-Host "  > $($_.Name): $hash"
          }
          $manifest | Out-File -FilePath "./dist/checksums.sha256" -Encoding utf8

          Write-Host "`nStaged Release Assets:"
          Get-ChildItem -Path "./dist" | Format-Table Name, Length, LastWriteTime

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: NodeRadar Pro ${{ steps.version.outputs.tag }}
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            ./dist/NodeRadar_Pro_v${{ steps.version.outputs.version }}_Setup.exe
            ./dist/NodeRadar_Pro_v${{ steps.version.outputs.version }}_Portable_win-x64.exe
            ./dist/checksums.sha256
