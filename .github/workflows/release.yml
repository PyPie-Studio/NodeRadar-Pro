name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Release Quality Gate
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Run Master Quality Gate (with Tests)
        shell: pwsh
        run: |
          ./scripts/Test-MasterGate.ps1 -WithTests -TestResultsDirectory "test-results"

      - name: Publish Test Summary to GitHub Actions
        if: always()
        shell: pwsh
        run: |
          $trxPath = "test-results/test-results.trx"
          if (Test-Path $trxPath) {
            [xml]$trx = Get-Content $trxPath
            $counters = $trx.TestRun.ResultSummary.Counters
            $total = $counters.total
            $passed = $counters.passed
            $failed = $counters.failed
            $skipped = [int]$counters.notExecuted + [int]$counters.notRunnable
            $times = $trx.TestRun.Times
            $durationSec = 0
            if ($times.start -and $times.finish) {
              $durationSec = [math]::Round(([datetime]$times.finish - [datetime]$times.start).TotalSeconds, 1)
            }
            
            $status = if ([int]$failed -gt 0) { 'FAILED' } else { 'PASSED' }
            $summaryLines = @(
              "## Release Pre-Flight Test Results ($status)",
              "",
              "| Metric | Value |",
              "| :--- | :--- |",
              "| **Total Tests** | $total |",
              "| **Passed** | $passed |",
              "| **Failed** | $failed |",
              "| **Skipped / Not Run** | $skipped |",
              "| **Duration** | ${durationSec}s |"
            )
            if ($env:GITHUB_STEP_SUMMARY) {
              ($summaryLines -join "`n") | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            }

            if ([int]$failed -gt 0) {
              foreach ($unitTestResult in $trx.SelectNodes("//UnitTestResult[@outcome='Failed']")) {
                $testName = $unitTestResult.testName
                $msg = $unitTestResult.Output.ErrorInfo.Message.Trim() -replace '\r?\n', ' '
                Write-Host "::error title=Test Failure::$($testName): $msg"
              }
            }
          }

      - name: Upload Test Results Artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-release
          path: test-results/
          if-no-files-found: ignore

  publish-release:
    name: Build, Package & Publish Release Assets
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $candidates = @(
            "C:\Program Files\Inno Setup 7",
            "C:\Program Files (x86)\Inno Setup 7"
          )
          foreach ($dir in $candidates) {
            if (Test-Path (Join-Path $dir "ISCC.exe")) {
              Write-Host "Found Inno Setup at $dir, adding to PATH"
              $dir | Out-File -FilePath $env:GITHUB_PATH -Append
              break
            }
          }

      - name: Build and Package Release Installer
        shell: pwsh
        run: |
          ./scripts/Build-ReleasePackage.ps1

      - name: Package Portable Zip Bundle
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $publishDir = "src\NodeRadarPro\bin\Release\net10.0-windows10.0.19041.0\win-x64\publish"
          $zipName = "releases\NodeRadarPro-$tag-win-x64-portable.zip"
          Compress-Archive -Path "$publishDir\*" -DestinationPath $zipName -Force
          Write-Host "Created portable archive: $zipName"

      - name: Generate Cryptographic SHA-256 Checksums
        shell: pwsh
        run: |
          $releaseFiles = Get-ChildItem -Path releases -Include "*.exe", "*.zip" -Recurse
          $checksums = foreach ($file in $releaseFiles) {
              $hash = (Get-FileHash -Path $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($file.Name)"
          }
          $checksumPath = "releases\SHA256SUMS.txt"
          $checksums | Set-Content -Path $checksumPath -Encoding utf8
          Write-Host "Generated SHA256SUMS.txt:"
          Get-Content $checksumPath

      - name: Generate Build Provenance Attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            releases/*.exe
            releases/*.zip
            releases/SHA256SUMS.txt

      - name: Extract Release Notes from CHANGELOG
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag -replace '^v', ''
          $notesFile = "RELEASE_NOTES.md"

          if (Test-Path "CHANGELOG.md") {
              $changelog = Get-Content "CHANGELOG.md" -Raw
              $pattern = "(?s)## (?:\[$version\]|NodeRadar Pro v$version).*?(?=(?:\r?\n## |\Z))"
              if ($changelog -match $pattern) {
                  $extracted = $matches[0].Trim()
                  $notesBody = ($extracted -replace "^##\s+.*?\r?\n", "" -replace "\r?\n---\s*$", "").Trim()
                  $header = "# NodeRadar Pro $tag`n`n$notesBody`n`n---`n`n"
                  $footerLines = @(
                      "## Installation Options",
                      "- **Installer**: Download ``NodeRadar.Pro_${tag}_Setup.exe`` and run the setup wizard.",
                      "- **Portable**: Download ``NodeRadarPro-${tag}-win-x64-portable.zip`` and extract to any folder.",
                      "",
                      "## Verification & Integrity",
                      "Verify downloaded binaries using the SHA-256 checksums in ``SHA256SUMS.txt``:",
                      "``````powershell",
                      "Get-FileHash .\<filename> -Algorithm SHA256",
                      "``````"
                  )
                  $footer = $footerLines -join "`n"
                  Set-Content -Path $notesFile -Value ($header + $footer) -Encoding utf8
                  Write-Host "Successfully extracted release notes for $version"
                  Get-Content $notesFile
                  exit 0
              }
          }

          Set-Content -Path $notesFile -Value "# NodeRadar Pro $tag`n`nAutomated release bundle for $tag." -Encoding utf8

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $notesFile = "RELEASE_NOTES.md"
          $assets = Get-ChildItem -Path releases -Include "*.exe", "*.zip", "*.txt" -Recurse | Select-Object -ExpandProperty FullName

          if (gh release view $tag 2>$null) {
              Write-Host "Updating existing release $tag with notes and assets..."
              if (Test-Path $notesFile) {
                  gh release edit $tag --notes-file $notesFile
              }
              gh release upload $tag $assets --clobber
          } else {
              Write-Host "Creating new release $tag..."
              gh release create $tag $assets --title "NodeRadar Pro $tag" --notes-file $notesFile
          }
