name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-and-test:
    name: Build & Test (Windows / .NET 10)
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: 'Directory.Packages.props'

      - name: Run Master Quality Gate (Smoke, Tests, Coverage, Format, Vulns)
        shell: pwsh
        run: |
          ./scripts/Test-MasterGate.ps1 -WithTests -CheckCoverage -TestResultsDirectory "test-results"

      - name: Publish Test Summary to GitHub Actions
        if: always()
        shell: pwsh
        run: |
          $trxPath = "test-results/test-results.trx"
          if (Test-Path $trxPath) {
            [xml]$trx = Get-Content $trxPath
            $counters = $trx.TestRun.ResultSummary.Counters
            $total = $counters.total
            $passed = $counters.passed
            $failed = $counters.failed
            $skipped = [int]$counters.notExecuted + [int]$counters.notRunnable
            $times = $trx.TestRun.Times
            $durationSec = 0
            if ($times.start -and $times.finish) {
              $durationSec = [math]::Round(([datetime]$times.finish - [datetime]$times.start).TotalSeconds, 1)
            }
            
            $status = if ([int]$failed -gt 0) { 'FAILED' } else { 'PASSED' }
            $summaryLines = @(
              "## CI Test Suite Results ($status)",
              "",
              "| Metric | Value |",
              "| :--- | :--- |",
              "| **Total Tests** | $total |",
              "| **Passed** | $passed |",
              "| **Failed** | $failed |",
              "| **Skipped / Not Run** | $skipped |",
              "| **Duration** | ${durationSec}s |"
            )
            if ($env:GITHUB_STEP_SUMMARY) {
              ($summaryLines -join "`n") | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            }

            if ([int]$failed -gt 0) {
              foreach ($unitTestResult in $trx.SelectNodes("//UnitTestResult[@outcome='Failed']")) {
                $testName = $unitTestResult.testName
                $errorInfo = $unitTestResult.Output.ErrorInfo
                $msg = if ($errorInfo -and $errorInfo.Message) {
                  $errorInfo.Message.Trim() -replace '\r?\n', ' '
                } else {
                  "Test failed without detailed error message."
                }
                Write-Host "::error title=Test Failure::$($testName): $msg"
              }
            }
          }

      - name: Upload Test Results Artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-ci
          path: test-results/
          if-no-files-found: ignore
